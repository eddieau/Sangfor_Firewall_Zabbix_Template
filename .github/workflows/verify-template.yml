name: Verify template JSON matches generator

# Guards the two #1 maintenance rules:
#  1. template_sangfor_ngaf_snmp.json must be exactly what
#     scripts/gen_template.py produces (no drift between generator and
#     shipped JSON).
#  2. the shipped JSON must pass scripts/check_template.py (structural
#     integrity: uuid hygiene, macro/trigger/graph/dashboard reference
#     resolution, anchored trap keys, unique widget references...).

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Regenerate template from generator
        run: python3 scripts/gen_template.py

      - name: Fail if committed JSON differs from generated JSON
        run: |
          if ! git diff --exit-code -- template_sangfor_ngaf_snmp.json; then
            echo "::error::template_sangfor_ngaf_snmp.json is out of sync."
            echo "Run 'python3 scripts/gen_template.py' and commit the result."
            git diff --stat -- template_sangfor_ngaf_snmp.json
            exit 1
          fi

      - name: Integrity checks (refs, macros, uuids, traps, dashboard)
        run: python3 scripts/check_template.py

      - name: Scripts compile cleanly
        run: python3 -m py_compile scripts/*.py

  live-import:
    # Proves the file actually imports into a REAL Zabbix 8.0 and that live
    # object counts match the JSON (static checks missed three releases of
    # silently-skipped trigger changes). Fresh throwaway stack per run.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Start throwaway Zabbix 8.0 stack
        run: docker compose -f ci/docker-compose.yml up -d

      - name: Previous release template (upgrade-path test)
        run: git show HEAD~1:template_sangfor_ngaf_snmp.json > "$RUNNER_TEMP/prev_template.json" || true

      - name: Live import (fresh + upgrade) and count assertions
        env:
          PREV_TEMPLATE: ${{ runner.temp }}/prev_template.json
        run: python3 scripts/ci_import_test.py

      - name: Server log on failure
        if: failure()
        run: docker compose -f ci/docker-compose.yml logs --tail=100 zabbix-server

      - name: Teardown
        if: always()
        run: docker compose -f ci/docker-compose.yml down -v
